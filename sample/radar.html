<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Furuno NXT DR-4D · Radar View</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">Furuno NXT DR-4D</div>
    <nav class="app-nav">
      <a href="/index.html">Controls</a>
      <a href="/radar.html" data-active="true">Radar View</a>
      <a href="/settings.html">Settings</a>
      <a href="/status.html">System Status</a>
    </nav>
  </header>

  <main class="layout-radar">
    <section class="panel panel--preview-full">
      <h2>Live Radar View</h2>
      <div class="radar-viewport">
        <canvas id="radarHistoryCanvas" class="preview preview--radar-full" width="1024" height="1024" aria-label="Radar history view"></canvas>
        <img id="radarImage" class="preview preview--radar-full radar-fallback" src="/newest_png" alt="No radar image">
      </div>
      <div class="radar-history-controls" aria-label="History controls">
        <div class="radar-history-control">
          <label for="historyDepthRange">Track length</label>
          <div class="history-depth-inputs">
            <input type="range" id="historyDepthRange" min="1" max="50" step="1">
          </div>
        </div>
        <div class="radar-history-control">
          <label for="currentFrameColor">Current color</label>
          <input type="color" id="currentFrameColor" value="#ffe600">
        </div>
        <div class="radar-history-control">
          <label for="historyFrameColor">Track color</label>
          <input type="color" id="historyFrameColor" value="#ff00ff">
        </div>
        <div class="radar-history-control radar-history-control--actions">
          <button type="button" id="resetHistoryControls">Reset Colors</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    Live view refreshes every 500ms for maximum updates. Adjust the controls above to tune how many frames are layered (1–50) and what colors are used.
  </footer>

  <script src="/script.js" defer></script>
</body>
</html>
