<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Furuno NXT DR-4D · System Status</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">Furuno NXT DR-4D</div>
    <nav class="app-nav">
      <a href="/index.html">Controls</a>
      <a href="/radar.html">Radar View</a>
      <a href="/settings.html">Settings</a>
      <a href="/status.html" data-active="true">System Status</a>
    </nav>
  </header>

  <main class="layout-status">
    <section class="panel status-card">
      <span class="status-title">Newest Capture</span>
      <span id="statusNewestPng" class="status-value small-note">–</span>
    </section>

    <section class="panel status-card">
      <span class="status-title">Pattern Queue</span>
      <span id="statusQueueLength" class="status-value">0</span>
    </section>

    <section class="panel status-card">
      <span class="status-title">CPU Load</span>
      <span id="statusCpuLabel" class="status-value">--%</span>
      <div class="progress"><span id="statusCpu"></span></div>
      <div id="cpuCores" class="status-core-list"></div>
    </section>

    <section class="panel status-card">
      <span class="status-title">Memory Usage</span>
      <span id="statusMemoryLabel" class="status-value">--%</span>
      <div class="progress"><span id="statusMemory"></span></div>
    </section>

    <section class="panel status-card">
      <span class="status-title">Storage</span>
      <span id="statusStorageLabel" class="status-value">--%</span>
      <div class="progress"><span id="statusStorage"></span></div>
    </section>

    <section class="panel status-card">
      <span class="status-title">Network</span>
      <span id="statusNetworkLabel" class="status-value">-- / -- MB/s</span>
      <div class="progress"><span id="statusNetwork"></span></div>
    </section>

    <section class="panel status-card">
      <span class="status-title">Temperature</span>
      <span id="statusTempLabel" class="status-value">--°C / --°F</span>
      <div class="progress"><span id="statusTemp"></span></div>
    </section>
  </main>

  <footer>
    All data on this page is updated every 500ms.
  </footer>

  <script src="/script.js" defer></script>
</body>
</html>
