<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Furuno NXT DR-4D Control</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header><h1>Furuno&nbsp;NXT&nbsp;DR-4D&nbsp;Radar Control</h1></header>

<main>

<!-- ========================================================== -->
<!--  LIVE IMAGE                                                -->
<!-- ========================================================== -->
<div class="card full">
  <h3>Live Radar Image</h3>
  <img id="radarImage" src="/newest_png" alt="No radar image">
</div>

<!-- ========================================================== -->
<!--  POWER PANEL                                               -->
<!-- ========================================================== -->
<div class="card">
  <fieldset>
    <legend>⚡ Power</legend>
    <div class="row">
      <label>Radar No</label>
      <input type="number" id="radarNo" value="0" class="mini">
      <button onclick="toggleEcho('on')">TX ON</button>
      <button onclick="toggleEcho('off')">STBY</button>
      <a href="#" onclick="refreshTx();return false;">🔄</a>
    </div>
    <div class="row" style="margin-top: 0.5em;">
      <button onclick="beginCalibration()">Begin Calibration</button>
      <button onclick="stopCalibration()">TERMINATE</button>
    </div>
    <div id="txResult" class="resultBox"></div>
  </fieldset>
</div>


<!-- ========================================================== -->
<!--  GAIN SWEEP / PATTERN PANEL                                -->
<!-- ========================================================== -->
<div class="card calib-lock-card" id="patternCard">
  <fieldset>
    <legend>Gain/Range Pattern Sweep</legend>
    <div class="row">
      <label>Steps</label>
      <input id="gainSweepSteps" class="mini" style="width:20rem" placeholder="0,20,10;1,30,5">
      <label>Repeat</label>
      <input id="gainSweepRepeat" class="mini" type="number" value="-1" title="-1 = forever">
      <button onclick="startGainSweep()">Start</button>
      <button onclick="stopGainSweep()">Stop</button>
    </div>
    <div>
      <small>
        <b>Steps:</b> <code>range,gain,repeat #;range,gain,repeat #;...</code><br>
        Repeat <code>-1</code> = infinite, <code>1</code>=run once, etc.
      </small>
    </div>
    <div id="gainSweepResult" class="resultBox"></div>
  </fieldset>
</div>


<!-- ========================================================== -->
<!--  RANGE / PULSE PANEL                                       -->
<!-- ========================================================== -->
<div class="card calib-lock-card" id="rangeCard">
  <fieldset>
    <legend>Range & Pulse</legend>

    <!-- quick combo -->
    <div class="row">
      <label>Range</label>
      <select id="rangeIndex">
        <option value="21">0.0625 NM</option><option value="0" selected>0.125 NM</option>
        <option value="1">0.25 NM</option><option value="2">0.5 NM</option>
        <option value="3">0.75 NM</option><option value="4">1 NM</option>
        <option value="5">1.5 NM</option><option value="6">2 NM</option>
        <option value="7">3 NM</option><option value="8">4 NM</option>
        <option value="9">6 NM</option><option value="10">8 NM</option>
        <option value="11">12 NM</option><option value="12">16 NM</option>
        <option value="13">24 NM</option><option value="14">32 NM</option>
        <option value="19">36 NM</option>
      </select>

      <label>Pulse</label>
      <select id="pwPulse">
        <option value="0">S1</option><option value="1">S2</option>
        <option value="2">M1</option><option value="3">M2</option>
        <option value="4">M3</option><option value="5">L</option>
      </select>

      <button onclick="applyRangePulse()">Apply Both</button>
      <a href="#" onclick="refreshRange();return false;">🔄</a>
    </div>

    <!-- individual controls -->
    <details>
      <summary>More&hellip;</summary>
      <div class="row">
        <button onclick="setRange()">Set&nbsp;Range&nbsp;only</button>
        <button onclick="setPulse()">Set&nbsp;Pulse&nbsp;only</button>
      </div>
    </details>

    <div id="rangeResult" class="resultBox"></div>
  </fieldset>
</div>

<!-- ========================================================== -->
<!--  GAIN PANEL                                                -->
<!-- ========================================================== -->
<div class="card calib-lock-card" id="gainCard">
  <fieldset>
    <legend>Gain</legend>

    <div class="row">
      <label>Manual (0-100)</label>
      <input type="number" id="gainManual" value="50" min="0" max="100" class="mini">
      <button onclick="setGainManual()">Set</button>
      <a href="#" onclick="refreshGain();return false;">🔄</a>
    </div>

    <details>
      <summary>Auto / A-C SEA / A-C RAIN / STC</summary>

      <!-- auto gain -->
      <div class="row">
        <label>Auto value</label><input id="gainAuto" type="number" value="30" min="0" max="100" class="mini">
        <button onclick="setGainAuto()">Set Auto</button>
      </div>

      <!-- STC -->
      <div class="row">
        <label>STC near</label><input id="nearStc"  type="number" value="0" min="0" max="4" class="mini">
        <label>mid</label><input  id="midStc"   type="number" value="0" min="0" max="3" class="mini">
        <label>far</label><input  id="farStc"   type="number" value="0" min="0" max="2" class="mini">
        <button onclick="setSTC()">Set STC</button>
      </div>

      <!-- A/C SEA -->
      <div class="row">
        <label>SEA M/A</label>
        <input id="seaMan" type="number" value="20" min="0" max="100" class="mini">
        <input id="seaAuto" type="number" value="30" min="0" max="100" class="mini">
        <button onclick="setACSEA()">Set SEA</button>
      </div>

      <!-- A/C RAIN -->
      <div class="row">
        <label>RAIN M/A</label>
        <input id="rainMan" type="number" value="40" min="0" max="100" class="mini">
        <input id="rainAuto" type="number" value="50" min="0" max="100" class="mini">
        <button onclick="setACRAIN()">Set RAIN</button>
      </div>
    </details>

    <div id="gainResult" class="resultBox"></div>
  </fieldset>
</div>

<!-- ========================================================== -->
<!--  DISPLAY PANEL                                             -->
<!-- ========================================================== -->
<div class="card calib-lock-card" id="displayCard">
  <fieldset>
    <legend>Display</legend>
    <div class="row">
      <label>Sweep lines</label>
      <select id="sweepMode">
        <option value="3" selected>1024</option>
        <option value="0">2048</option><option value="1">4096</option>
        <option value="2">8192</option><option value="4">720</option>
      </select>

      <label>Interpolation</label>
      <select id="interpEnable">
        <option value="1" selected>On</option><option value="0">Off</option>
      </select>

      <button onclick="applySweepInterp()">Apply</button>
      <a href="#" onclick="refreshDisplay();return false;">🔄</a>
    </div>

    <details>
      <summary>Antenna RPM</summary>
      <div class="row">
        <label>HI RPM</label>
        <select id="hiRpm"><option value="0">Off</option><option value="1">On</option></select>
        <label>RollSpd</label>
        <select id="rollSpd"><option value="2">Auto</option><option value="0">LO</option><option value="1">HI</option></select>
        <button onclick="setAntennaRev()">Set</button>
      </div>
    </details>

    <div id="displayResult" class="resultBox"></div>
  </fieldset>
</div>

</main>

<!-- ========================================================== -->
<!-- INFO OVERLAY                                               -->
<!-- ========================================================== -->
<div id="infoIcon">ℹ️</div>
<div id="infoCard">
  <div class="info-header"><span>System Info</span><button id="closeInfo">&times;</button></div>
  <div class="info-content">
    <p>Newest PNG: <span id="newestPng">–</span></p>
  </div>
</div>

<!-- ========================================================== -->
<!-- JAVASCRIPT                                                 -->
<!-- ========================================================== -->
<script src="/script.js" defer></script>
</body></html>
