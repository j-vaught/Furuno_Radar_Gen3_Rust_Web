[package]
name = "radar-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "radar-client"
path = "src/main.rs"

[dependencies]
socket2 = "0.5"
libc = "0.2"
png = "0.17"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
