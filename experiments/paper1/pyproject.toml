[project]
name = "paper1-experiments"
version = "0.1.0"
description = "Reproducible first-experiment capture and analysis tools for Paper 1"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.6", "ty>=0.0.1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"
